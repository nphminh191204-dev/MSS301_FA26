services:
  # ==========================================
  # Infrastructure Databases
  # ==========================================
  mysql:
    image: mysql:8.3.0
    container_name: mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: mysql
    volumes:
      - ./order-service/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql-data:/var/lib/mysql

  mongodb:
    image: mongo:7.0.5
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: product-service
    volumes:
      - mongo-data:/data/db

  # ==========================================
  # Microservices (Using Shared Dockerfile)
  # ==========================================
  product-service:
    build:
      context: ./product-service
      dockerfile: ../Dockerfile
      args:
        JAR_FILE: target/*.jar
        PORT: 8080
    container_name: product-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_MONGODB_HOST=mongodb
      - SPRING_DATA_MONGODB_PORT=27017
      - SPRING_DATA_MONGODB_USERNAME=root
      - SPRING_DATA_MONGODB_PASSWORD=password
      - SPRING_DATA_MONGODB_DATABASE=product-service
    depends_on:
      - mongodb

  inventory-service:
    build:
      context: ./inventory-service
      dockerfile: ../Dockerfile
      args:
        JAR_FILE: target/*.jar
        PORT: 8082
    container_name: inventory-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/inventory_service
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=mysql
    depends_on:
      - mysql

  order-service:
    build:
      context: ./order-service
      dockerfile: ../Dockerfile
      args:
        JAR_FILE: target/*.jar
        PORT: 8081
    container_name: order-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/order_service
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=mysql
      - INVENTORY_URL=http://inventory-service:8082
      - SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED=false
    depends_on:
      - mysql
      - inventory-service

volumes:
  mysql-data:
  mongo-data:
